# Windows arm64: cross-build on windows-2022 (same runner as amd64 CI) + llvm-mingw.
name: Windows ARM64 release binaries

on:
  push:
    branches:
      - win-arm/**
  pull_request:
    branches:
      - win-arm/**
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tailscaled-arm64.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o tailscaled-arm64.exe ./cmd/tailscaled

      - name: Build tailscale-ffi-arm64.dll
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-Wno-deprecated-non-prototype"
        run: |
          $ver = "20250402"
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          $dir = Join-Path $root "llvm-mingw-$ver-ucrt-x86_64"
          if (-not (Test-Path $dir)) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $zip = Join-Path $root "llvm-mingw-$ver-ucrt-x86_64.zip"
            Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath $dir -Force
          }
          $gcc = Get-ChildItem $dir -Filter aarch64-w64-mingw32-gcc.exe -Recurse | Select-Object -First 1
          if (-not $gcc) { throw "aarch64-w64-mingw32-gcc.exe not found" }
          $env:CC = $gcc.FullName
          $env:PATH = "$($gcc.DirectoryName);$env:PATH"
          go build -trimpath -buildmode=c-shared -ldflags="-s -w" -o tailscale-ffi-arm64.dll ./cmd/tailscale-ffi

      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tailscaled-arm64.exe tailscale-ffi-arm64.dll --clobber

      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-${{ github.run_id }}
          path: |
            tailscaled-arm64.exe
            tailscale-ffi-arm64.dll
