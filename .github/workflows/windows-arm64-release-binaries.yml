# Windows arm64: tailscaled-arm64.exe + tailscale-ffi-arm64.dll
# Native build on GitHub-hosted windows-11-arm runner (no llvm-mingw cross toolchain).
name: Windows ARM64 release binaries

on:
  push:
    branches:
      - win-arm/**
  pull_request:
    branches:
      - win-arm/**
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: windows-11-arm

    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify ARM64 runner
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') {
            throw "Expected Arm64 runner, got $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          }
          Write-Host "Runner OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          go env GOOS GOARCH

      - name: Build tailscaled-arm64.exe
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o tailscaled-arm64.exe ./cmd/tailscaled

      - name: Build tailscale-ffi-arm64.dll
        run: go build -trimpath -buildmode=c-shared -ldflags="-s -w" -o cmd/tailscale-ffi/tailscale-ffi-arm64.dll ./cmd/tailscale-ffi

      - name: Verify ARM64 PE machine type
        shell: pwsh
        run: |
          function Assert-Arm64Pe($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 0x40) { throw "$path too small" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -le 0 -or ($peOffset + 6) -gt $bytes.Length) {
              throw "$path invalid PE offset $peOffset"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw "$path machine=0x{0:X4}, expected 0xAA64 (ARM64)" -f $machine
            }
            Write-Host "$path is ARM64 PE"
          }
          Assert-Arm64Pe "tailscaled-arm64.exe"
          Assert-Arm64Pe "cmd/tailscale-ffi/tailscale-ffi-arm64.dll"

      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tailscaled-arm64.exe cmd/tailscale-ffi/tailscale-ffi-arm64.dll --clobber

      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-${{ github.run_id }}
          path: |
            tailscaled-arm64.exe
            cmd/tailscale-ffi/tailscale-ffi-arm64.dll
            cmd/tailscale-ffi/tailscale-ffi-arm64.h
